<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; background: transparent; }
  #loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #d7b08b;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 2px;
    z-index: 99;
  }
</style>
</head>
<body>
<div id="loading">LOADING AVATAR...</div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.getElementById('loading').textContent = 'AVATAR OFFLINE';
  throw new Error('Three.js failed to load');
}

document.getElementById('loading').style.display = 'none';

const W = window.innerWidth;
const H = window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xfff2df, 0x1b1d24, 1.15);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e3, 1.25);
key.position.set(1.2, 2.2, 2.8);
scene.add(key);

const fill = new THREE.DirectionalLight(0xcbd7ff, 0.5);
fill.position.set(-1.6, 1.2, 1.8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(0.4, 1.3, -2.3);
scene.add(rim);

const floorShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.55, 40),
  new THREE.MeshBasicMaterial({ color: 0x0a0a0f, transparent: true, opacity: 0.22 })
);
floorShadow.rotation.x = -Math.PI / 2;
floorShadow.position.y = 0.005;
scene.add(floorShadow);

const avatarRoot = new THREE.Group();
scene.add(avatarRoot);

let model = null;
let mixer = null;
let idleAction = null;
let headBone = null;
let spineBone = null;
let state = 'idle';
let walking = false;
let t = 0;

function setPortraitCamera() {
  camera.position.set(0, 1.58, 1.6);
  camera.lookAt(0, 1.48, 0);
}

function setFullCamera() {
  camera.position.set(0, 1.1, 3.2);
  camera.lookAt(0, 1.0, 0);
}

window.setView = function(v) {
  if (v === 'full') {
    setFullCamera();
  } else {
    setPortraitCamera();
  }
};

window.setState = function(s) {
  state = s || 'idle';
};

window.setWalking = function(w) {
  walking = !!w;
};

function findBone(root, regex) {
  let found = null;
  root.traverse((node) => {
    if (!found && node.isBone && regex.test(node.name)) {
      found = node;
    }
  });
  return found;
}

function createFallbackHuman() {
  const skin = new THREE.MeshPhongMaterial({ color: 0xd3a27a, specular: 0xfff0db, shininess: 28 });
  const cloth = new THREE.MeshPhongMaterial({ color: 0x374258, specular: 0xa7c6ff, shininess: 26 });

  const fallback = new THREE.Group();

  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.66, 30), cloth);
  torso.position.y = 1.06;
  fallback.add(torso);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.12, 16), skin);
  neck.position.y = 1.45;
  fallback.add(neck);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 36, 36), skin);
  head.position.y = 1.68;
  head.scale.set(0.86, 1.0, 0.9);
  fallback.add(head);

  function arm(side) {
    const g = new THREE.Group();
    g.position.set(side * 0.26, 1.22, 0);

    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.33, 14), skin);
    upper.position.y = -0.17;
    g.add(upper);

    const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.31, 14), skin);
    fore.position.y = -0.48;
    fore.rotation.z = side * 0.08;
    g.add(fore);

    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 14), skin);
    hand.scale.set(0.9, 0.65, 0.75);
    hand.position.y = -0.68;
    g.add(hand);

    fallback.add(g);
  }

  arm(-1);
  arm(1);

  function leg(side) {
    const g = new THREE.Group();
    g.position.set(side * 0.1, 0.72, 0);

    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.42, 14), cloth);
    thigh.position.y = -0.22;
    g.add(thigh);

    const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.045, 0.4, 14), cloth);
    shin.position.y = -0.62;
    g.add(shin);

    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.06, 14, 14), cloth);
    foot.scale.set(1.1, 0.55, 1.8);
    foot.position.set(0, -0.84, 0.06);
    g.add(foot);

    fallback.add(g);
  }

  leg(-1);
  leg(1);

  avatarRoot.add(fallback);
  model = fallback;
  headBone = head;
  spineBone = torso;
}

function loadHumanModel() {
  if (typeof THREE.GLTFLoader === 'undefined') {
    createFallbackHuman();
    return;
  }

  const loader = new THREE.GLTFLoader();
  loader.load(
    'models/CesiumMan.glb',
    (gltf) => {
      model = gltf.scene;
      model.scale.set(1.45, 1.45, 1.45);
      model.position.set(0, 0, 0);
      avatarRoot.add(model);

      mixer = new THREE.AnimationMixer(model);
      if (gltf.animations && gltf.animations.length > 0) {
        idleAction = mixer.clipAction(gltf.animations[0]);
        idleAction.play();
      }

      headBone = findBone(model, /head/i);
      spineBone = findBone(model, /(spine|chest)/i);
    },
    undefined,
    () => {
      createFallbackHuman();
    }
  );
}

loadHumanModel();
setPortraitCamera();

function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  const breath = Math.sin(t * 1.7) * 0.008;

  if (model) {
    model.position.y = Math.sin(t * 1.3) * 0.015;
    model.rotation.y = Math.sin(t * 0.45) * 0.045;
    model.scale.y = model.scale.y > 0 ? model.scale.y : 1;
  }

  if (mixer) {
    const rate = (walking || state === 'speaking') ? 1.05 : (state === 'thinking' ? 0.65 : 0.85);
    mixer.update(0.016 * rate);
  }

  if (idleAction) {
    idleAction.paused = false;
    idleAction.setEffectiveWeight(1.0);
  }

  if (spineBone) {
    spineBone.rotation.x = breath;
  }

  if (headBone) {
    if (state === 'speaking') {
      headBone.rotation.x = Math.sin(t * 8.5) * 0.08;
      headBone.rotation.y = Math.sin(t * 4.5) * 0.05;
      headBone.rotation.z = Math.sin(t * 6.0) * 0.025;
    } else if (state === 'thinking') {
      headBone.rotation.x = -0.08 + Math.sin(t * 2.1) * 0.03;
      headBone.rotation.y = Math.sin(t * 1.4) * 0.14;
      headBone.rotation.z = Math.sin(t * 0.9) * 0.05;
    } else {
      headBone.rotation.x = Math.sin(t * 1.8) * 0.02;
      headBone.rotation.y = Math.sin(t * 1.2) * 0.025;
      headBone.rotation.z = 0;
    }
  }

  floorShadow.scale.setScalar(1 + Math.sin(t * 1.5) * 0.02);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
