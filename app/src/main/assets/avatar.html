<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:100vw; height:100vh; }
  canvas { display:block; }
</style>
</head>
<body>
<script>
/* ============================================================
   S.A.S.H.A. — Photorealistic 2D Canvas Portrait
   No blob. No 3D primitives. Pure painted anatomy.
   Dark-skinned woman, sharp features, glossy dark hair,
   burgundy lips, dark brown eyes. Portrait framing.
   Animated: breathe · blink · speak · think.
============================================================ */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, CX, CY, SCALE;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
  SCALE = Math.min(W, H) / 420;
}
resize();
window.addEventListener('resize', resize);

/* ── state ── */
let state   = 'idle';
let t       = 0;

/* ── blink ── */
let blinkT      = 0;
let blinkPhase  = 0; // 0=open 1=closing 2=opening
let blinkFrame  = 0;
let nextBlink   = 3.5;

/* ── speak ── */
let jawOpen = 0;  // 0..1

/* ── breath ── */
let breathY = 0;

/* ── head sway ── */
let headSwayX = 0;
let headSwayY = 0;

window.setState   = s => { state = s; };
window.setWalking = () => {};
window.setView    = () => {};

/* ══════════════════════════════════════════════
   DRAWING — each function is a painter's layer
══════════════════════════════════════════════ */

function s(v) { return v * SCALE; } // scale helper

/* background gradient */
function drawBG() {
  const g = ctx.createRadialGradient(CX, CY*0.7, s(20), CX, CY, s(260));
  g.addColorStop(0,   '#141020');
  g.addColorStop(0.6, '#0a0a12');
  g.addColorStop(1,   '#060608');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* subtle purple halo behind figure */
function drawHalo(ox, oy) {
  const g = ctx.createRadialGradient(CX+ox, CY*0.55+oy, s(10), CX+ox, CY*0.55+oy, s(160));
  g.addColorStop(0,   'rgba(100,60,180,0.18)');
  g.addColorStop(0.5, 'rgba(60,20,120,0.08)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(CX+ox, CY*0.55+oy, s(160), s(200), 0, 0, Math.PI*2);
  ctx.fill();
}

/* ── HAIR (back layer, behind face) ── */
function drawHairBack(ox, oy) {
  ctx.save();
  // Long dark brunette — back mass
  const hg = ctx.createLinearGradient(CX+ox, CY*0.15+oy, CX+ox, CY*0.95+oy);
  hg.addColorStop(0,   '#120b05');
  hg.addColorStop(0.4, '#1e1108');
  hg.addColorStop(1,   '#0a0603');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(CX - s(110)+ox, CY*0.28+oy);
  ctx.bezierCurveTo(
    CX - s(140)+ox, CY*0.20+oy,
    CX - s(155)+ox, CY*0.32+oy,
    CX - s(148)+ox, CY*0.72+oy
  );
  ctx.bezierCurveTo(
    CX - s(140)+ox, CY*0.90+oy,
    CX - s(80)+ox,  CY*1.05+oy,
    CX           +ox, CY*1.08+oy
  );
  ctx.bezierCurveTo(
    CX + s(80)+ox,  CY*1.05+oy,
    CX + s(140)+ox, CY*0.90+oy,
    CX + s(148)+ox, CY*0.72+oy
  );
  ctx.bezierCurveTo(
    CX + s(155)+ox, CY*0.32+oy,
    CX + s(140)+ox, CY*0.20+oy,
    CX + s(110)+ox, CY*0.28+oy
  );
  ctx.bezierCurveTo(
    CX + s(80)+ox,  CY*0.14+oy,
    CX - s(80)+ox,  CY*0.14+oy,
    CX - s(110)+ox, CY*0.28+oy
  );
  ctx.closePath();
  ctx.fill();

  // Hair shine streak
  const shine = ctx.createLinearGradient(CX - s(60)+ox, CY*0.18+oy, CX+ox, CY*0.28+oy);
  shine.addColorStop(0,   'rgba(90,55,20,0)');
  shine.addColorStop(0.5, 'rgba(90,55,20,0.18)');
  shine.addColorStop(1,   'rgba(90,55,20,0)');
  ctx.fillStyle = shine;
  ctx.beginPath();
  ctx.ellipse(CX - s(30)+ox, CY*0.21+oy, s(60), s(18), -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ── NECK ── */
function drawNeck(ox, oy) {
  ctx.save();
  const ng = ctx.createLinearGradient(CX - s(32)+ox, 0, CX + s(32)+ox, 0);
  ng.addColorStop(0,   '#7a4a2a');
  ng.addColorStop(0.25,'#c07040');
  ng.addColorStop(0.5, '#d08048');
  ng.addColorStop(0.75,'#b06030');
  ng.addColorStop(1,   '#7a4a2a');
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.moveTo(CX - s(32)+ox, CY*0.74+oy);
  ctx.bezierCurveTo(CX - s(30)+ox, CY*0.70+oy, CX - s(28)+ox, CY*0.65+oy, CX - s(28)+ox, CY*0.60+oy);
  ctx.lineTo(CX + s(28)+ox, CY*0.60+oy);
  ctx.bezierCurveTo(CX + s(28)+ox, CY*0.65+oy, CX + s(30)+ox, CY*0.70+oy, CX + s(32)+ox, CY*0.74+oy);
  ctx.closePath();
  ctx.fill();

  // Neck shadow
  const ns = ctx.createRadialGradient(CX+ox, CY*0.62+oy, s(5), CX+ox, CY*0.62+oy, s(40));
  ns.addColorStop(0,   'rgba(0,0,0,0)');
  ns.addColorStop(1,   'rgba(0,0,0,0.22)');
  ctx.fillStyle = ns;
  ctx.beginPath();
  ctx.rect(CX - s(32)+ox, CY*0.60+oy, s(64), s(14));
  ctx.fill();
  ctx.restore();
}

/* ── SHOULDERS ── */
function drawShoulders(ox, oy) {
  ctx.save();
  const sg = ctx.createLinearGradient(CX - s(160)+ox, 0, CX + s(160)+ox, 0);
  sg.addColorStop(0,   '#1a0f22');
  sg.addColorStop(0.15,'#2d1a3a');
  sg.addColorStop(0.5, '#201428');
  sg.addColorStop(0.85,'#2d1a3a');
  sg.addColorStop(1,   '#1a0f22');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(CX - s(160)+ox, H);
  ctx.bezierCurveTo(
    CX - s(160)+ox, CY*0.92+oy,
    CX - s(90)+ox,  CY*0.82+oy,
    CX - s(36)+ox,  CY*0.74+oy
  );
  ctx.lineTo(CX + s(36)+ox, CY*0.74+oy);
  ctx.bezierCurveTo(
    CX + s(90)+ox,  CY*0.82+oy,
    CX + s(160)+ox, CY*0.92+oy,
    CX + s(160)+ox, H
  );
  ctx.closePath();
  ctx.fill();

  // Collarbone highlight
  const cl = ctx.createLinearGradient(CX - s(70)+ox, CY*0.76+oy, CX + s(70)+ox, CY*0.76+oy);
  cl.addColorStop(0,   'rgba(120,75,40,0)');
  cl.addColorStop(0.35,'rgba(180,110,60,0.28)');
  cl.addColorStop(0.5, 'rgba(200,130,70,0.32)');
  cl.addColorStop(0.65,'rgba(180,110,60,0.28)');
  cl.addColorStop(1,   'rgba(120,75,40,0)');
  ctx.fillStyle = cl;
  ctx.beginPath();
  ctx.ellipse(CX+ox, CY*0.77+oy, s(70), s(6), 0.08, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ── FACE BASE ── */
function drawFaceBase(ox, oy, blinkAmt) {
  ctx.save();

  // Face oval — warm deep brown skin
  const fg = ctx.createRadialGradient(CX+ox - s(8), CY*0.35+oy, s(10), CX+ox, CY*0.39+oy, s(110));
  fg.addColorStop(0,   '#e2a070');
  fg.addColorStop(0.18,'#cc8852');
  fg.addColorStop(0.55,'#b87040');
  fg.addColorStop(0.85,'#9a5830');
  fg.addColorStop(1,   '#7a3e1e');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.ellipse(CX+ox, CY*0.39+oy, s(88), s(108), 0, 0, Math.PI*2);
  ctx.fill();

  // Forehead highlight
  const fh = ctx.createRadialGradient(CX+ox - s(5), CY*0.18+oy, 0, CX+ox - s(5), CY*0.18+oy, s(55));
  fh.addColorStop(0,   'rgba(255,200,140,0.28)');
  fh.addColorStop(1,   'rgba(255,200,140,0)');
  ctx.fillStyle = fh;
  ctx.beginPath();
  ctx.ellipse(CX+ox - s(5), CY*0.18+oy, s(55), s(38), -0.1, 0, Math.PI*2);
  ctx.fill();

  // Cheek warmth / blush
  [[- s(60), s(4), 0.16], [s(60), s(4), 0.12]].forEach(([dx, dy, a]) => {
    const cg = ctx.createRadialGradient(CX+ox+dx, CY*0.43+oy+dy, 0, CX+ox+dx, CY*0.43+oy+dy, s(34));
    cg.addColorStop(0,   `rgba(185,70,50,${a})`);
    cg.addColorStop(1,   'rgba(185,70,50,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(CX+ox+dx, CY*0.43+oy+dy, s(34), s(22), 0.2, 0, Math.PI*2);
    ctx.fill();
  });

  // Cheekbone highlight
  [[- s(55), s(-4), -0.35], [s(58), s(-4), 0.35]].forEach(([dx, dy, rot]) => {
    const chg = ctx.createLinearGradient(
      CX+ox+dx - s(20), CY*0.37+oy+dy,
      CX+ox+dx + s(20), CY*0.37+oy+dy
    );
    chg.addColorStop(0,   'rgba(230,150,80,0)');
    chg.addColorStop(0.5, 'rgba(230,150,80,0.20)');
    chg.addColorStop(1,   'rgba(230,150,80,0)');
    ctx.fillStyle = chg;
    ctx.beginPath();
    ctx.ellipse(CX+ox+dx, CY*0.37+oy+dy, s(28), s(10), rot, 0, Math.PI*2);
    ctx.fill();
  });

  // Under-chin shadow
  const cs = ctx.createLinearGradient(0, CY*0.60+oy, 0, CY*0.70+oy);
  cs.addColorStop(0,   'rgba(0,0,0,0)');
  cs.addColorStop(1,   'rgba(0,0,0,0.35)');
  ctx.fillStyle = cs;
  ctx.beginPath();
  ctx.ellipse(CX+ox, CY*0.65+oy, s(70), s(15), 0, 0, Math.PI*2);
  ctx.fill();

  // Jaw / chin definition
  const jaw2 = ctx.createLinearGradient(CX+ox - s(85), CY*0.55+oy, CX+ox - s(60), CY*0.48+oy);
  jaw2.addColorStop(0,   'rgba(0,0,0,0.22)');
  jaw2.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = jaw2;
  ctx.beginPath(); ctx.ellipse(CX+ox - s(78), CY*0.52+oy, s(14), s(20), 0.3, 0, Math.PI*2); ctx.fill();
  const jaw3 = ctx.createLinearGradient(CX+ox + s(85), CY*0.55+oy, CX+ox + s(60), CY*0.48+oy);
  jaw3.addColorStop(0,   'rgba(0,0,0,0.22)');
  jaw3.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = jaw3;
  ctx.beginPath(); ctx.ellipse(CX+ox + s(78), CY*0.52+oy, s(14), s(20), -0.3, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ── EARS ── */
function drawEars(ox, oy) {
  ctx.save();
  [[-1,1]].forEach(() => {
    [-1, 1].forEach(side => {
      const ex = CX+ox + side * s(87);
      const ey = CY*0.38+oy;
      const eg = ctx.createRadialGradient(ex - side*s(4), ey, 0, ex, ey, s(18));
      eg.addColorStop(0,   '#c07848');
      eg.addColorStop(1,   '#884428');
      ctx.fillStyle = eg;
      ctx.beginPath();
      ctx.ellipse(ex, ey, s(12), s(18), side*0.15, 0, Math.PI*2);
      ctx.fill();
      // Inner ear shadow
      const ieg = ctx.createRadialGradient(ex, ey, 0, ex, ey, s(10));
      ieg.addColorStop(0.3, 'rgba(60,20,8,0.45)');
      ieg.addColorStop(1,   'rgba(60,20,8,0)');
      ctx.fillStyle = ieg;
      ctx.beginPath();
      ctx.ellipse(ex + side*s(2), ey, s(8), s(12), 0, 0, Math.PI*2);
      ctx.fill();
    });
  });
  ctx.restore();
}

/* ── NOSE ── */
function drawNose(ox, oy) {
  ctx.save();
  const nx = CX+ox;
  const ny = CY*0.42+oy;

  // Bridge shadow (left side of nose)
  const bsl = ctx.createLinearGradient(nx - s(12), ny - s(24), nx - s(2), ny);
  bsl.addColorStop(0,   'rgba(0,0,0,0)');
  bsl.addColorStop(1,   'rgba(0,0,0,0.18)');
  ctx.fillStyle = bsl;
  ctx.beginPath();
  ctx.moveTo(nx - s(6), ny - s(26));
  ctx.bezierCurveTo(nx - s(14), ny - s(18), nx - s(16), ny - s(4), nx - s(8), ny + s(8));
  ctx.bezierCurveTo(nx - s(4), ny + s(10), nx - s(2), ny + s(9), nx - s(1), ny + s(8));
  ctx.bezierCurveTo(nx - s(2), ny, nx - s(4), ny - s(18), nx - s(4), ny - s(26));
  ctx.closePath();
  ctx.fill();

  // Nose tip — slightly wider / Nubian
  const ntg = ctx.createRadialGradient(nx, ny + s(10), 0, nx, ny + s(10), s(28));
  ntg.addColorStop(0,   '#c07848');
  ntg.addColorStop(0.5, '#a86030');
  ntg.addColorStop(1,   'rgba(100,45,18,0)');
  ctx.fillStyle = ntg;
  ctx.beginPath();
  ctx.ellipse(nx, ny + s(10), s(26), s(16), 0, 0, Math.PI*2);
  ctx.fill();

  // Nostril shadows
  [[-s(14), s(12)], [s(14), s(12)]].forEach(([dx, dy]) => {
    const nog = ctx.createRadialGradient(nx+dx, ny+dy, 0, nx+dx, ny+dy, s(9));
    nog.addColorStop(0,   'rgba(40,12,4,0.70)');
    nog.addColorStop(0.6, 'rgba(40,12,4,0.30)');
    nog.addColorStop(1,   'rgba(40,12,4,0)');
    ctx.fillStyle = nog;
    ctx.beginPath();
    ctx.ellipse(nx+dx, ny+dy, s(9), s(7), dx<0 ? -0.4 : 0.4, 0, Math.PI*2);
    ctx.fill();
  });

  // Nose highlight
  const nhl = ctx.createLinearGradient(nx, ny - s(22), nx, ny + s(2));
  nhl.addColorStop(0,   'rgba(240,170,90,0)');
  nhl.addColorStop(0.5, 'rgba(240,170,90,0.22)');
  nhl.addColorStop(1,   'rgba(240,170,90,0)');
  ctx.fillStyle = nhl;
  ctx.beginPath();
  ctx.ellipse(nx + s(3), ny - s(8), s(5), s(18), 0, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ── EYES ── */
function drawEyes(ox, oy, blinkAmt) {
  ctx.save();
  const ey = CY*0.34+oy;

  [[-s(36), 1], [s(36), -1]].forEach(([dx, flip]) => {
    const ex = CX+ox + dx;

    // Eye socket shadow
    const ess = ctx.createRadialGradient(ex, ey, s(2), ex, ey + s(2), s(26));
    ess.addColorStop(0,   'rgba(30,8,2,0.40)');
    ess.addColorStop(1,   'rgba(30,8,2,0)');
    ctx.fillStyle = ess;
    ctx.beginPath();
    ctx.ellipse(ex, ey + s(1), s(26), s(14), 0, 0, Math.PI*2);
    ctx.fill();

    // Eyeball white
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(ex, ey, s(20), s(14)*( 1 - blinkAmt*0.9), 0, 0, Math.PI*2);
    ctx.fillStyle = '#f0e8e0';
    ctx.fill();

    // Iris — deep dark brown
    const ig = ctx.createRadialGradient(ex - s(2), ey - s(2), 0, ex, ey, s(9));
    ig.addColorStop(0,   '#4a2810');
    ig.addColorStop(0.4, '#361808');
    ig.addColorStop(0.85,'#200e04');
    ig.addColorStop(1,   '#100602');
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.arc(ex, ey, s(9) * (1 - blinkAmt*0.85), 0, Math.PI*2);
    ctx.fill();

    // Pupil
    ctx.fillStyle = '#090302';
    ctx.beginPath();
    ctx.arc(ex, ey, s(5) * (1 - blinkAmt*0.85), 0, Math.PI*2);
    ctx.fill();

    // Catchlight
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.ellipse(ex - s(3), ey - s(3), s(2.5), s(2), -0.3, 0, Math.PI*2);
    ctx.fill();
    // Secondary small glint
    ctx.fillStyle = 'rgba(255,255,255,0.40)';
    ctx.beginPath();
    ctx.arc(ex + s(3), ey + s(2), s(1.2), 0, Math.PI*2);
    ctx.fill();

    ctx.restore(); // clip for eyelid

    // Upper lid coverage (blink)
    if (blinkAmt > 0) {
      const lidH = s(14) * blinkAmt;
      const lidG = ctx.createLinearGradient(0, ey - s(14)*0.4, 0, ey + lidH);
      lidG.addColorStop(0,   '#7a4820');
      lidG.addColorStop(1,   '#9a6030');
      ctx.fillStyle = lidG;
      ctx.beginPath();
      ctx.ellipse(ex, ey - s(14)*0.4 + lidH*0.5, s(20), s(14)*0.5 + lidH*0.5, 0, Math.PI, Math.PI*2);
      ctx.fill();
    }

    // Upper lash line
    const lashThick = s(2.5 + blinkAmt*2);
    ctx.strokeStyle = '#1a0808';
    ctx.lineWidth = lashThick;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ex - s(21), ey - s(7)*(1-blinkAmt));
    ctx.bezierCurveTo(
      ex - s(10), ey - s(13)*(1-blinkAmt),
      ex + s(10), ey - s(13)*(1-blinkAmt),
      ex + s(21), ey - s(7)*(1-blinkAmt)
    );
    ctx.stroke();

    // Lower lash (subtle)
    ctx.strokeStyle = 'rgba(30,8,8,0.55)';
    ctx.lineWidth = s(1.2);
    ctx.beginPath();
    ctx.moveTo(ex - s(19), ey + s(9)*(1-blinkAmt*0.5));
    ctx.bezierCurveTo(ex, ey + s(13)*(1-blinkAmt*0.3), ex + s(10), ey + s(13)*(1-blinkAmt*0.3), ex + s(19), ey + s(9)*(1-blinkAmt*0.5));
    ctx.stroke();

    // Eye shadow makeup — smoky
    const smk = ctx.createLinearGradient(0, ey - s(16), 0, ey - s(6));
    smk.addColorStop(0,   'rgba(40,12,20,0.35)');
    smk.addColorStop(1,   'rgba(40,12,20,0)');
    ctx.fillStyle = smk;
    ctx.beginPath();
    ctx.ellipse(ex, ey - s(9), s(22), s(9), 0, 0, Math.PI);
    ctx.fill();
  });

  ctx.restore();
}

/* ── EYEBROWS ── */
function drawBrows(ox, oy) {
  ctx.save();
  ctx.lineCap = 'round';

  [[-s(36), 1, -0.12], [s(36), -1, 0.12]].forEach(([dx, flip, tilt]) => {
    const bx = CX+ox + dx;
    const by = CY*0.26+oy;

    // Brow fill
    ctx.fillStyle = '#1e0e06';
    ctx.beginPath();
    ctx.moveTo(bx - s(22), by + s(4));
    ctx.bezierCurveTo(bx - s(12), by - s(4), bx + s(6), by - s(6), bx + s(22), by + s(2));
    ctx.bezierCurveTo(bx + s(14), by + s(7), bx - s(4), by + s(8), bx - s(22), by + s(6));
    ctx.closePath();
    ctx.fill();

    // Brow highlight — inner arch
    const bhg = ctx.createLinearGradient(bx - s(22), 0, bx + s(22), 0);
    bhg.addColorStop(0,   'rgba(60,25,10,0)');
    bhg.addColorStop(0.4, 'rgba(60,25,10,0.30)');
    bhg.addColorStop(1,   'rgba(60,25,10,0)');
    ctx.fillStyle = bhg;
    ctx.beginPath();
    ctx.moveTo(bx - s(22), by + s(4));
    ctx.bezierCurveTo(bx - s(12), by - s(4), bx + s(6), by - s(6), bx + s(22), by + s(2));
    ctx.bezierCurveTo(bx + s(14), by + s(7), bx - s(4), by + s(8), bx - s(22), by + s(6));
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
}

/* ── LIPS ── */
function drawLips(ox, oy, jawOpenAmt) {
  ctx.save();
  const lx = CX+ox;
  const ly = CY*0.536+oy;
  const jd = jawOpenAmt * s(10); // jaw drop

  // Philtrum shadow
  const phg = ctx.createRadialGradient(lx, ly - s(8), 0, lx, ly - s(8), s(12));
  phg.addColorStop(0,   'rgba(0,0,0,0.20)');
  phg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = phg;
  ctx.beginPath(); ctx.ellipse(lx, ly - s(5), s(10), s(8), 0, 0, Math.PI*2); ctx.fill();

  // Lip base fill — Cupid's bow upper
  const ulg = ctx.createLinearGradient(0, ly - s(10), 0, ly + s(2));
  ulg.addColorStop(0,   '#8a2030');
  ulg.addColorStop(0.5, '#a02838');
  ulg.addColorStop(1,   '#6a1825');
  ctx.fillStyle = ulg;
  ctx.beginPath();
  ctx.moveTo(lx - s(26), ly);
  ctx.bezierCurveTo(lx - s(20), ly - s(3), lx - s(10), ly - s(9), lx, ly - s(7));
  ctx.bezierCurveTo(lx + s(10), ly - s(9), lx + s(20), ly - s(3), lx + s(26), ly);
  ctx.bezierCurveTo(lx + s(16), ly + s(7), lx + s(2), ly + s(8), lx, ly + s(8));
  ctx.bezierCurveTo(lx - s(2), ly + s(8), lx - s(16), ly + s(7), lx - s(26), ly);
  ctx.closePath();
  ctx.fill();

  // Lower lip (drops with jaw)
  const llg = ctx.createLinearGradient(0, ly + s(8), 0, ly + s(20) + jd);
  llg.addColorStop(0,   '#a8303a');
  llg.addColorStop(0.4, '#b83840');
  llg.addColorStop(1,   '#7a1e28');
  ctx.fillStyle = llg;
  ctx.beginPath();
  ctx.moveTo(lx - s(26), ly + s(8));
  ctx.bezierCurveTo(lx - s(18), ly + s(9), lx - s(4), ly + s(10), lx, ly + s(10));
  ctx.bezierCurveTo(lx + s(4), ly + s(10), lx + s(18), ly + s(9), lx + s(26), ly + s(8));
  ctx.bezierCurveTo(lx + s(20), ly + s(18) + jd, lx + s(2), ly + s(20) + jd, lx, ly + s(20) + jd);
  ctx.bezierCurveTo(lx - s(2), ly + s(20) + jd, lx - s(20), ly + s(18) + jd, lx - s(26), ly + s(8));
  ctx.closePath();
  ctx.fill();

  // Mouth opening (visible when jaw opens)
  if (jawOpenAmt > 0.05) {
    const mog = ctx.createLinearGradient(0, ly + s(8), 0, ly + s(12) + jd*0.6);
    mog.addColorStop(0,   'rgba(18,4,6,0.9)');
    mog.addColorStop(1,   'rgba(6,2,2,0.8)');
    ctx.fillStyle = mog;
    ctx.beginPath();
    ctx.ellipse(lx, ly + s(9) + jd*0.3, s(14)*jawOpenAmt + s(4), s(3) + jd*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    // Teeth hint
    if (jawOpenAmt > 0.3) {
      const tg = ctx.createLinearGradient(0, ly + s(8.5), 0, ly + s(12) + jd*0.2);
      tg.addColorStop(0, 'rgba(240,225,205,0.60)');
      tg.addColorStop(1, 'rgba(200,185,165,0.20)');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.ellipse(lx, ly + s(9.5) + jd*0.15, s(12)*jawOpenAmt, s(2.5) + jd*0.2, 0, 0, Math.PI);
      ctx.fill();
    }
  }

  // Lip gloss highlight
  const lhl = ctx.createLinearGradient(0, ly - s(9), 0, ly - s(2));
  lhl.addColorStop(0,   'rgba(255,180,180,0.45)');
  lhl.addColorStop(1,   'rgba(255,180,180,0)');
  ctx.fillStyle = lhl;
  ctx.beginPath();
  ctx.moveTo(lx - s(18), ly - s(2));
  ctx.bezierCurveTo(lx - s(10), ly - s(8), lx + s(10), ly - s(8), lx + s(18), ly - s(2));
  ctx.bezierCurveTo(lx + s(8), ly + s(1), lx - s(8), ly + s(1), lx - s(18), ly - s(2));
  ctx.closePath();
  ctx.fill();

  // Lower lip gloss
  const llh = ctx.createRadialGradient(lx, ly + s(14) + jd*0.4, 0, lx, ly + s(14) + jd*0.4, s(16));
  llh.addColorStop(0,   'rgba(255,170,160,0.30)');
  llh.addColorStop(1,   'rgba(255,170,160,0)');
  ctx.fillStyle = llh;
  ctx.beginPath();
  ctx.ellipse(lx, ly + s(14) + jd*0.4, s(14), s(5) + jd*0.15, 0, 0, Math.PI*2);
  ctx.fill();

  // Mouth corner lines
  ctx.strokeStyle = 'rgba(60,10,18,0.55)';
  ctx.lineWidth = s(0.8);
  [[-s(26), 0], [s(26), 0]].forEach(([dx]) => {
    ctx.beginPath();
    ctx.moveTo(lx+dx, ly - s(1));
    ctx.bezierCurveTo(lx+dx, ly + s(4), lx+dx, ly + s(7), lx+dx, ly + s(8));
    ctx.stroke();
  });

  ctx.restore();
}

/* ── HAIR FRONT (over face edges) ── */
function drawHairFront(ox, oy) {
  ctx.save();
  const hfg = ctx.createLinearGradient(CX+ox, CY*0.06+oy, CX+ox, CY*0.25+oy);
  hfg.addColorStop(0,   '#130b04');
  hfg.addColorStop(0.6, '#1f1208');
  hfg.addColorStop(1,   'rgba(20,10,4,0)');
  ctx.fillStyle = hfg;

  // Hairline — natural soft arc
  ctx.beginPath();
  ctx.moveTo(CX - s(90)+ox, CY*0.22+oy);
  ctx.bezierCurveTo(
    CX - s(70)+ox, CY*0.10+oy,
    CX - s(30)+ox, CY*0.07+oy,
    CX      +ox,   CY*0.08+oy
  );
  ctx.bezierCurveTo(
    CX + s(30)+ox, CY*0.07+oy,
    CX + s(70)+ox, CY*0.10+oy,
    CX + s(90)+ox, CY*0.22+oy
  );
  ctx.bezierCurveTo(
    CX + s(100)+ox, CY*0.18+oy,
    CX + s(100)+ox, CY*0.06+oy,
    CX + s(60)+ox,  CY*0.04+oy
  );
  ctx.bezierCurveTo(
    CX + s(20)+ox, CY*0.02+oy,
    CX - s(20)+ox, CY*0.02+oy,
    CX - s(60)+ox, CY*0.04+oy
  );
  ctx.bezierCurveTo(
    CX - s(100)+ox, CY*0.06+oy,
    CX - s(100)+ox, CY*0.18+oy,
    CX - s(90)+ox,  CY*0.22+oy
  );
  ctx.closePath();
  ctx.fill();

  // Left wisp strand
  const wl = ctx.createLinearGradient(CX - s(88)+ox, CY*0.22+oy, CX - s(70)+ox, CY*0.42+oy);
  wl.addColorStop(0,   '#1f1208');
  wl.addColorStop(1,   'rgba(20,10,4,0)');
  ctx.fillStyle = wl;
  ctx.beginPath();
  ctx.moveTo(CX - s(88)+ox, CY*0.22+oy);
  ctx.bezierCurveTo(CX - s(94)+ox, CY*0.30+oy, CX - s(90)+ox, CY*0.40+oy, CX - s(78)+ox, CY*0.44+oy);
  ctx.bezierCurveTo(CX - s(72)+ox, CY*0.40+oy, CX - s(74)+ox, CY*0.30+oy, CX - s(80)+ox, CY*0.24+oy);
  ctx.closePath();
  ctx.fill();

  // Right wisp strand
  const wr = ctx.createLinearGradient(CX + s(88)+ox, CY*0.22+oy, CX + s(70)+ox, CY*0.42+oy);
  wr.addColorStop(0,   '#1f1208');
  wr.addColorStop(1,   'rgba(20,10,4,0)');
  ctx.fillStyle = wr;
  ctx.beginPath();
  ctx.moveTo(CX + s(88)+ox, CY*0.22+oy);
  ctx.bezierCurveTo(CX + s(94)+ox, CY*0.30+oy, CX + s(90)+ox, CY*0.40+oy, CX + s(78)+ox, CY*0.44+oy);
  ctx.bezierCurveTo(CX + s(72)+ox, CY*0.40+oy, CX + s(74)+ox, CY*0.30+oy, CX + s(80)+ox, CY*0.24+oy);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/* ── PARTICLES (subtle) ── */
const pCount = 45;
const px = [], py = [], psp = [], pSize = [], pAlpha = [];
for (let i = 0; i < pCount; i++) {
  px[i]    = Math.random() * 1.0 - 0.5;  // -0.5..0.5 relative to CX
  py[i]    = Math.random() * 2.0 - 0.2;  // relative to H
  psp[i]   = 0.0003 + Math.random() * 0.0006;
  pSize[i] = 0.8 + Math.random() * 2.4;
  pAlpha[i]= 0.08 + Math.random() * 0.18;
}
function drawParticles() {
  ctx.save();
  for (let i = 0; i < pCount; i++) {
    py[i] -= psp[i];
    if (py[i] < -0.1) { py[i] = 1.05; px[i] = Math.random() - 0.5; }
    const ppx = CX + px[i] * W;
    const ppy = py[i] * H;
    ctx.fillStyle = `rgba(120,70,220,${pAlpha[i]})`;
    ctx.beginPath();
    ctx.arc(ppx, ppy, pSize[i], 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

/* ── HUD frame — thin cyberpunk corner brackets ── */
function drawHUD() {
  const pad  = s(12);
  const fl   = pad, fr = W - pad, ft = pad, fb = H - pad;
  const brk  = s(28);
  const alpha = 0.4 + Math.sin(t * 1.4) * 0.08;

  ctx.save();
  ctx.strokeStyle = `rgba(0,200,255,${alpha})`;
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'square';

  [[fl, ft, 1, 1], [fr, ft, -1, 1], [fl, fb, 1, -1], [fr, fb, -1, -1]].forEach(([cx2, cy2, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(cx2, cy2 + sy*brk); ctx.lineTo(cx2, cy2); ctx.lineTo(cx2 + sx*brk, cy2); ctx.stroke();
    // accent dot
    ctx.fillStyle = `rgba(139,92,246,${alpha*1.5})`;
    ctx.beginPath(); ctx.arc(cx2, cy2, 2.2, 0, Math.PI*2); ctx.fill();
  });

  // Status text bottom-left
  ctx.fillStyle = `rgba(0,200,255,${alpha*0.9})`;
  ctx.font = `bold ${s(11)}px monospace`;
  ctx.fillText('S.A.S.H.A.  NODE_01', fl + s(6), fb - s(8));

  // State indicator top-right
  const stateLabel = state === 'speaking' ? '◉ SPEAKING' : state === 'thinking' ? '◎ THINKING' : '● IDLE';
  const stateColor = state === 'speaking' ? `rgba(80,220,80,${alpha})` : state === 'thinking' ? `rgba(255,190,0,${alpha})` : `rgba(0,200,255,${alpha*0.7})`;
  ctx.fillStyle = stateColor;
  ctx.textAlign = 'right';
  ctx.fillText(stateLabel, fr - s(6), ft + s(16));
  ctx.textAlign = 'left';
  ctx.restore();
}

/* ════════════════════════════════════
   MAIN RENDER LOOP
════════════════════════════════════ */
function draw() {
  /* blink animation */
  blinkT += 0.016;
  if (blinkPhase === 0 && blinkT > nextBlink) {
    blinkPhase = 1;
    blinkT = 0;
  }
  if (blinkPhase === 1) { blinkFrame += 0.18; if (blinkFrame >= 1) { blinkFrame = 1; blinkPhase = 2; } }
  if (blinkPhase === 2) { blinkFrame -= 0.22; if (blinkFrame <= 0) { blinkFrame = 0; blinkPhase = 0; blinkT = 0; nextBlink = 2.8 + Math.random()*2.5; } }
  const blink = blinkFrame;

  /* breath */
  breathY = Math.sin(t * 1.2) * s(2.5);

  /* head sway */
  if (state === 'thinking') {
    headSwayX = Math.sin(t * 0.55) * s(7);
    headSwayY = Math.sin(t * 0.38) * s(4);
  } else if (state === 'speaking') {
    headSwayX = Math.sin(t * 4.0) * s(2);
    headSwayY = Math.sin(t * 3.2) * s(1.5);
  } else {
    headSwayX += (Math.sin(t * 0.30) * s(3) - headSwayX) * 0.06;
    headSwayY += (Math.sin(t * 0.22) * s(2) - headSwayY) * 0.06;
  }

  /* jaw (speaking) */
  if (state === 'speaking') {
    jawOpen += (Math.abs(Math.sin(t * 12)) * 0.65 + 0.1 - jawOpen) * 0.25;
  } else {
    jawOpen += (0 - jawOpen) * 0.15;
  }

  const ox = headSwayX;
  const oy = headSwayY + breathY;

  ctx.clearRect(0, 0, W, H);

  drawBG();
  drawParticles();
  drawHalo(ox, oy);
  drawHairBack(ox, oy);
  drawShoulders(0, breathY * 0.5);
  drawNeck(ox, oy);
  drawEars(ox, oy);
  drawFaceBase(ox, oy, blink);
  drawBrows(ox, oy);
  drawNose(ox, oy);
  drawEyes(ox, oy, blink);
  drawLips(ox, oy, jawOpen);
  drawHairFront(ox, oy);
  drawHUD();

  t += 0.016;
  requestAnimationFrame(draw);
}
draw();
</script>
