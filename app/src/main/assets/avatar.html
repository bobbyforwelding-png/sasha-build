<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  * { margin:0; padding:0; }
  body { background:#000; overflow:hidden; width:100vw; height:100vh; }
  canvas { display:block; }
  #loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#9ee6ff; font-family:monospace; font-size:12px; z-index:99; }
</style>
</head>
<body>
<div id="loading">SASHA ONLINE...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.getElementById('loading').style.display='none';

const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W/H, 0.1, 100);
camera.position.set(0, 0.35, 3.6);
camera.lookAt(0, -0.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const amb = new THREE.AmbientLight(0x88aaff, 0.9);
scene.add(amb);
const light1 = new THREE.PointLight(0x9ee6ff, 2.0, 20);
light1.position.set(1.5, 1.8, 3.5);
scene.add(light1);
const light2 = new THREE.PointLight(0xc47bff, 0.9, 20);
light2.position.set(-1.6, 0.2, 2.5);
scene.add(light2);
const rim = new THREE.PointLight(0x9ee6ff, 0.6, 12);
rim.position.set(0, 0.5, -2.2);
scene.add(rim);

const sasha = new THREE.Group();
scene.add(sasha);

// ============ MATERIALS ============
const skinMat = new THREE.MeshPhongMaterial({
    color: 0xc9a0b5,
    emissive: 0x301022,
    specular: 0x9ee6ff,
    shininess: 70,
    transparent: true,
    opacity: 0.92,
    side: THREE.DoubleSide
});
const skinSoft = new THREE.MeshPhongMaterial({
    color: 0xd9aec0,
    emissive: 0x301022,
    specular: 0x9ee6ff,
    shininess: 60,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide
});
const glowMat = new THREE.MeshBasicMaterial({ color: 0x9ee6ff, transparent: true, opacity: 0.5 });
const hairMat = new THREE.MeshPhongMaterial({
    color: 0x2a1830,
    emissive: 0x180a22,
    specular: 0x9ee6ff,
    shininess: 90,
    transparent: true,
    opacity: 0.95,
    side: THREE.DoubleSide
});
const wireHolo = new THREE.MeshBasicMaterial({ color: 0x9ee6ff, wireframe: true, transparent: true, opacity: 0.1 });
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x9ee6ff, transparent: true, opacity: 0.35 });

// ============ HELPERS ============
function limb(bottom, top, length, mat) {
    const g = new THREE.CylinderGeometry(bottom, top, length, 14, 8);
    return new THREE.Mesh(g, mat);
}
function joint(r, mat) {
    const g = new THREE.SphereGeometry(r, 12, 12);
    const m = new THREE.Mesh(g, mat);
    m.scale.z = 1.25;
    return m;
}

// ============ HEAD ============
const head = new THREE.Group();
head.position.y = 1.86;
sasha.add(head);

const skullGeo = new THREE.SphereGeometry(0.28, 32, 32);
const skull = new THREE.Mesh(skullGeo, skinMat);
skull.scale.set(0.82, 1.0, 0.88);
skull.position.y = 0.08;
head.add(skull);

const skullWire = new THREE.Mesh(skullGeo.clone(), wireHolo);
skullWire.scale.copy(skull.scale);
skullWire.position.copy(skull.position);
head.add(skullWire);

// Jaw
const jawGeo = new THREE.SphereGeometry(0.22, 24, 24);
const jaw = new THREE.Mesh(jawGeo, skinMat);
jaw.scale.set(0.72, 0.62, 0.78);
jaw.position.set(0, -0.14, -0.02);
head.add(jaw);

// Neck
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.11, 0.22, 14), skinMat);
neck.position.y = -0.34;
head.add(neck);

// ============ EARS ============
function ear(x) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 10), skinSoft);
    e.position.set(x * 0.255, -0.03, 0.05);
    e.scale.set(0.5, 0.9, 0.4);
    head.add(e);
}
ear(-1); ear(1);

// ============ EYES ============
function createEye(x) {
    const g = new THREE.Group();
    g.position.set(x, 0.09, 0.23);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16),
        new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x223344, specular: 0xffffff, shininess: 140 }));
    g.add(ball);
    const iris = new THREE.Mesh(new THREE.CircleGeometry(0.034, 24),
        new THREE.MeshBasicMaterial({ color: 0x8fd9ff }));
    iris.position.z = 0.052;
    g.add(iris);
    const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.016, 16),
        new THREE.MeshBasicMaterial({ color: 0x0a0a1a }));
    pupil.position.z = 0.056;
    g.add(pupil);
    const lash = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.014, 0.02),
        new THREE.MeshBasicMaterial({ color: 0x180a22, transparent: true, opacity: 0.8 }));
    lash.position.set(0, 0.052, 0.015);
    lash.rotation.x = -0.15;
    g.add(lash);
    return g;
}
const leftEye = createEye(-0.115);
const rightEye = createEye(0.115);
head.add(leftEye);
head.add(rightEye);

// ============ BROWS ============
function brow(x, y) {
    const g = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.012, 0.014),
        new THREE.MeshBasicMaterial({ color: 0x2a1830, transparent: true, opacity: 0.85 }));
    g.position.set(x, y, 0.235);
    g.rotation.z = x < 0 ? -0.12 : 0.12;
    head.add(g);
}
brow(-0.115, 0.19);
brow(0.115, 0.19);

// ============ NOSE ============
const noseGeo = new THREE.ConeGeometry(0.026, 0.14, 10);
const noseMesh = new THREE.Mesh(noseGeo, skinSoft);
noseMesh.position.set(0, -0.04, 0.26);
noseMesh.rotation.x = Math.PI / 2.4;
head.add(noseMesh);
const noseTip = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), skinSoft);
noseTip.position.set(0, -0.10, 0.25);
head.add(noseTip);

// ============ LIPS ============
const lipMat = new THREE.MeshPhongMaterial({
    color: 0xb0556a,
    emissive: 0x401020,
    specular: 0xff88aa,
    shininess: 90,
    transparent: true,
    opacity: 0.9
});
const upperLip = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 16), lipMat);
upperLip.scale.set(1.0, 0.32, 0.55);
upperLip.position.set(0, -0.185, 0.245);
head.add(upperLip);
const lowerLip = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 16), lipMat);
lowerLip.scale.set(0.95, 0.28, 0.5);
lowerLip.position.set(0, -0.215, 0.24);
head.add(lowerLip);

// Mouth interior
const mouthGeo = new THREE.SphereGeometry(0.05, 12, 12);
const mouthOpen = new THREE.Mesh(mouthGeo,
    new THREE.MeshBasicMaterial({ color: 0x200510, transparent: true, opacity: 0.6 }));
mouthOpen.scale.set(0.9, 0.2, 0.6);
mouthOpen.position.set(0, -0.2, 0.225);
head.add(mouthOpen);

// ============ HAIR ============
function strand(x, z, len, curve, thick) {
    const pts = [];
    for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        pts.push(new THREE.Vector3(
            x + Math.sin(t * curve) * 0.06 * (1 - t * 0.4),
            0.42 - t * len,
            z - t * 0.12
        ));
    }
    const c = new THREE.CatmullRomCurve3(pts);
    const g = new THREE.TubeGeometry(c, 12, thick || 0.006, 5, false);
    const m = new THREE.Mesh(g, hairMat);
    return m;
}
// Crown
for (let i = -12; i <= 12; i++) {
    const x = i * 0.024;
    const len = 0.34 + Math.abs(i) * 0.012;
    head.add(strand(x, 0.18, len, (i * 0.35) + 0.6, 0.007));
}
// Fringe
for (let i = -8; i <= 8; i++) {
    const x = i * 0.022;
    head.add(strand(x, 0.28, 0.22 + Math.abs(i) * 0.008, 1.6 + Math.abs(i) * 0.2, 0.005));
}
// Sides + back
for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 7; i++) {
        head.add(strand(side * (0.16 + i * 0.03), 0.2, 0.5 + i * 0.09, side * (0.8 + i * 0.25), 0.006));
    }
}
// Back cascade
for (let i = -6; i <= 6; i++) {
    const x = i * 0.022;
    head.add(strand(x, -0.05, 0.42 + Math.abs(i) * 0.02, 0.3 + i * 0.1, 0.007));
}

// ============ TORSO ============
const torso = new THREE.Group();
torso.position.y = 1.2;
sasha.add(torso);

// Torso lathe profile - feminine silhouette
const tp = [
    [0.115, 0.0],   // neck base
    [0.20, 0.03],   // shoulders
    [0.235, 0.12],  // upper chest
    [0.26, 0.22],   // bust top
    [0.28, 0.30],   // bust peak
    [0.23, 0.40],   // under bust
    [0.175, 0.48],  // waist
    [0.185, 0.56],
    [0.25, 0.64],   // hip rise
    [0.285, 0.72],  // hip widest
    [0.26, 0.80],   // hip lower
    [0.17, 0.86],   // crotch
];
const torsoPts = tp.map(p => new THREE.Vector2(p[0], p[1]));
const torsoGeo = new THREE.LatheGeometry(torsoPts, 32);
const torsoMesh = new THREE.Mesh(torsoGeo, skinMat);
torso.add(torsoMesh);
torso.add(new THREE.Mesh(torsoGeo.clone(), wireHolo));

// Bust
function bust(x) {
    const g = new THREE.Group();
    const bg = new THREE.SphereGeometry(0.11, 18, 18);
    const b = new THREE.Mesh(bg, skinSoft);
    b.scale.set(1.0, 0.78, 0.7);
    g.add(b);
    g.position.set(x * 0.135, 0.28, 0.115);
    torso.add(g);
}
bust(-1); bust(1);

// Shoulders
function shoulder(x) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 12), skinSoft);
    s.position.set(x * 0.22, 0.035, 0);
    torso.add(s);
}
shoulder(-1); shoulder(1);

// Clavicle line
const clavPts = [new THREE.Vector3(-0.2, 0.06, 0.05), new THREE.Vector3(0, 0.085, 0.075), new THREE.Vector3(0.2, 0.06, 0.05)];
const clavCurve = new THREE.CatmullRomCurve3(clavPts);
const clavMesh = new THREE.Mesh(new THREE.TubeGeometry(clavCurve, 12, 0.004, 5, false), glowMat);
torso.add(clavMesh);

// Navel accent
const navel = new THREE.Mesh(new THREE.CircleGeometry(0.012, 12), glowMat);
navel.position.set(0, 0.46, 0.155);
navel.rotation.x = -Math.PI / 2;
torso.add(navel);

// ============ ARMS ============
function createArm(side) {
    const arm = new THREE.Group();
    arm.position.set(side * 0.24, 0.05, 0);
    // Upper arm
    const upper = limb(0.045, 0.055, 0.42, skinSoft);
    upper.position.y = -0.21;
    upper.rotation.z = side * 0.08;
    arm.add(upper);
    // Elbow
    const elbow = joint(0.05, skinSoft);
    elbow.position.set(side * 0.035, -0.42, 0);
    arm.add(elbow);
    // Forearm
    const fore = limb(0.035, 0.042, 0.38, skinSoft);
    fore.position.set(side * 0.07, -0.62, 0);
    fore.rotation.z = side * 0.06;
    arm.add(fore);
    // Wrist
    const wrist = joint(0.034, skinSoft);
    wrist.position.set(side * 0.09, -0.81, 0);
    arm.add(wrist);
    // Hand
    const hand = new THREE.Group();
    hand.position.set(side * 0.095, -0.86, 0);
    const palm = new THREE.Mesh(new THREE.SphereGeometry(0.038, 12, 12), skinSoft);
    palm.scale.set(1.0, 0.85, 0.6);
    hand.add(palm);
    for (let i = 0; i < 4; i++) {
        const f = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.006, 0.085, 6), skinSoft);
        f.position.set(side * (0.018 + i * 0.012), 0.045, i * 0.004);
        f.rotation.x = 0.12;
        hand.add(f);
    }
    const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.007, 0.06, 6), skinSoft);
    thumb.position.set(side * 0.038, 0.02, 0.015);
    thumb.rotation.x = -0.5;
    thumb.rotation.y = side * 0.6;
    hand.add(thumb);
    arm.add(hand);
    return arm;
}
const leftArm = createArm(-1);
const rightArm = createArm(1);
torso.add(leftArm);
torso.add(rightArm);

// ============ HIPS + LEGS ============
const hips = new THREE.Group();
hips.position.y = 0.32;
sasha.add(hips);

const hipPts = [
    [0.20, 0.0],
    [0.265, 0.04],
    [0.28, 0.10],
    [0.24, 0.16],
    [0.135, 0.19],
];
const hipProfile = hipPts.map(p => new THREE.Vector2(p[0], p[1]));
const hipGeo = new THREE.LatheGeometry(hipProfile, 32);
const hipMesh = new THREE.Mesh(hipGeo, skinMat);
hips.add(hipMesh);
hips.add(new THREE.Mesh(hipGeo.clone(), wireHolo));

function createLeg(side) {
    const leg = new THREE.Group();
    leg.position.set(side * 0.105, 0.12, 0);
    // Thigh
    const thigh = limb(0.06, 0.05, 0.5, skinSoft);
    thigh.position.y = -0.28;
    thigh.rotation.x = side * 0.01;
    leg.add(thigh);
    // Knee
    const knee = joint(0.055, skinSoft);
    knee.position.y = -0.55;
    leg.add(knee);
    // Shin
    const shin = limb(0.04, 0.032, 0.42, skinSoft);
    shin.position.y = -0.78;
    leg.add(shin);
    // Ankle
    const ankle = joint(0.032, skinSoft);
    ankle.position.y = -1.0;
    leg.add(ankle);
    // Foot
    const footGeo = new THREE.SphereGeometry(0.045, 12, 10);
    const foot = new THREE.Mesh(footGeo, skinSoft);
    foot.scale.set(1.0, 0.6, 1.8);
    foot.position.set(0, -1.05, 0.05);
    leg.add(foot);
    return leg;
}
const leftLeg = createLeg(-1);
const rightLeg = createLeg(1);
hips.add(leftLeg);
hips.add(rightLeg);

// ============ BASE RING + PARTICLES ============
const baseRing = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.006, 8, 48),
    new THREE.MeshBasicMaterial({ color: 0x9ee6ff, transparent: true, opacity: 0.3 }));
baseRing.position.y = -1.24;
baseRing.rotation.x = Math.PI / 2;
scene.add(baseRing);

const pCount = 130;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pSpeed = new Float32Array(pCount);
for (let i = 0; i < pCount; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.random() * Math.PI;
    const r = 1.0 + Math.random() * 2;
    pPos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pPos[i*3+1] = r * Math.cos(ph) * 0.9;
    pPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    pSpeed[i] = 0.002 + Math.random() * 0.005;
}
pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo,
    new THREE.PointsMaterial({ color: 0x9ee6ff, size: 0.014, transparent: true, opacity: 0.45 }));
scene.add(particles);

// ============ STATE MACHINE ============
let state = 'idle';
let t = 0;
window.setState = function(s) { state = s; };

window.setView = function(v) {
    if (v === 'full') {
        camera.position.set(0, -0.15, 4.9);
        camera.lookAt(0, -0.35, 0);
    } else {
        camera.position.set(0, 0.35, 3.6);
        camera.lookAt(0, -0.15, 0);
    }
};

let walking = false;
window.setWalking = function(w) { walking = w; };

function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    baseRing.rotation.z = t * 0.3;
    baseRing.scale.x = 1 + Math.sin(t * 1.5) * 0.03;

    const pp = particles.geometry.attributes.position.array;
    for (let i = 0; i < pCount; i++) {
        pp[i*3+1] += pSpeed[i];
        if (pp[i*3+1] > 2.4) { pp[i*3+1] = -2.4; const th = Math.random()*Math.PI*2; pp[i*3] = Math.cos(th)*(1.0+Math.random()*2); pp[i*3+2] = Math.sin(th)*(1.0+Math.random()*2); }
    }
    particles.geometry.attributes.position.needsUpdate = true;

    const blink = Math.sin(t * 0.8) > 0.985;
    const breath = Math.sin(t * 1.3) * 0.012;

    // Body idle
    sasha.position.y = Math.sin(t * 1.1) * 0.02;
    sasha.rotation.y = Math.sin(t * 0.35) * 0.05;
    torso.scale.y = 1 + breath;
    torso.scale.x = 1 - breath * 0.6;
    head.rotation.z = Math.sin(t * 0.5) * 0.03;

    // Walking gait
    if (walking) {
        const walk = Math.sin(t * 9);
        const step = Math.sin(t * 9);
        leftLeg.rotation.x = step * 0.5;
        rightLeg.rotation.x = -step * 0.5;
        leftArm.rotation.x = -step * 0.35;
        rightArm.rotation.x = step * 0.35;
        leftArm.rotation.z = -0.08 + walk * 0.06;
        rightArm.rotation.z = 0.08 - walk * 0.06;
        hips.rotation.x = Math.sin(t * 9) * 0.05;
        sasha.position.y = Math.abs(Math.cos(t * 9)) * 0.04;
        torso.rotation.y = walk * 0.04;
        head.rotation.y = walk * 0.03;
        head.rotation.x = Math.sin(t * 9) * 0.02;
    } else {
        leftLeg.rotation.x = Math.sin(t * 1.2) * 0.03;
        rightLeg.rotation.x = -Math.sin(t * 1.2) * 0.03;
        leftArm.rotation.x = Math.sin(t * 1.1) * 0.02;
        rightArm.rotation.x = -Math.sin(t * 1.1) * 0.02;
        leftArm.rotation.z = -0.08;
        rightArm.rotation.z = 0.08;
        hips.rotation.x = 0;
        torso.rotation.y = 0;
        head.rotation.x = 0;
    }

    // Speaking - mouth + face
    if (state === 'speaking') {
        const o = Math.abs(Math.sin(t * 13)) * 0.5 + 0.1;
        mouthOpen.scale.y = o;
        mouthOpen.scale.z = 0.4 + o * 0.5;
        lowerLip.position.y = -0.215 - o * 0.012;
        upperLip.position.y = -0.185 + o * 0.008;
        head.rotation.z = Math.sin(t * 5) * 0.04;
        leftEye.scale.y = 1 + Math.sin(t * 6) * 0.05;
        rightEye.scale.y = 1 - Math.sin(t * 6) * 0.05;
    } else {
        mouthOpen.scale.y = 0.2;
        mouthOpen.scale.z = 0.6;
        lowerLip.position.y = -0.215;
        upperLip.position.y = -0.185;
        leftEye.scale.y = 1;
        rightEye.scale.y = 1;
    }

    // Thinking - brows knit, eyes up
    if (state === 'thinking') {
        head.rotation.y = Math.sin(t * 0.6) * 0.14;
        head.rotation.x = Math.sin(t * 0.4) * 0.04;
        leftEye.position.y = 0.09 + Math.sin(t * 0.3) * 0.004;
        rightEye.position.y = 0.09 + Math.sin(t * 0.3) * 0.004;
        sasha.rotation.y = Math.sin(t * 0.6) * 0.08;
    } else {
        leftEye.position.y = 0.09;
        rightEye.position.y = 0.09;
    }

    // Blink
    if (blink && state !== 'speaking') {
        leftEye.scale.y = 0.05;
        rightEye.scale.y = 0.05;
        setTimeout(() => {
            leftEye.scale.y = 1;
            rightEye.scale.y = 1;
        }, 90);
    }

    // Lash/wire glow pulse
    wireHolo.opacity = 0.08 + Math.sin(t * 1.2) * 0.03;
    baseRing.material.opacity = 0.25 + Math.sin(t * 2) * 0.08;

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
