<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:100vw; height:100vh; }
  canvas { display:block; background:transparent; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   SASHA — Photorealistic 3-D Portrait
   Approach: canvas-generated textures on high-poly geometry to
   simulate a real human face with proper skin, eyes, lips, hair.
   No blob primitives — everything uses realistic proportions and
   painted texture maps.
================================================================ */

const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, W/H, 0.05, 80);
camera.position.set(0, 0.08, 1.32);
camera.lookAt(0, 0.04, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ── LIGHTING ── */
// Strong warm key from top-left front — classic portrait lighting
const keyLight = new THREE.DirectionalLight(0xfff5e8, 2.4);
keyLight.position.set(-0.6, 1.4, 2.2);
keyLight.castShadow = true;
scene.add(keyLight);

// Soft fill from right
const fillLight = new THREE.DirectionalLight(0xd4e8ff, 0.7);
fillLight.position.set(1.4, 0.2, 1.8);
scene.add(fillLight);

// Rim / back light — warm separation from background
const rimLight = new THREE.PointLight(0x8B5CF6, 1.1, 8);
rimLight.position.set(0.0, 0.5, -2.0);
scene.add(rimLight);

// Subtle under-chin bounce
const bounceLight = new THREE.PointLight(0xffe0b0, 0.35, 4);
bounceLight.position.set(0, -0.4, 1.2);
scene.add(bounceLight);

// Ambient
scene.add(new THREE.AmbientLight(0xfff0e0, 0.55));

/* ================================================================
   TEXTURE FACTORIES — all painted on <canvas> for zero network calls
================================================================ */

function makeSkinTexture(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    // Base gradient — warm olive-tan complexion
    const bg = ctx.createRadialGradient(size/2, size*0.45, size*0.05, size/2, size*0.45, size*0.6);
    bg.addColorStop(0,   '#e8a87c');
    bg.addColorStop(0.35,'#d9956a');
    bg.addColorStop(0.7, '#c07c55');
    bg.addColorStop(1.0, '#a86040');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,size,size);

    // Subtle pore noise
    for (let i = 0; i < size * size * 0.06; i++) {
        const px = (Math.random() * size)|0;
        const py = (Math.random() * size)|0;
        const v  = Math.random() * 18 - 9;
        ctx.fillStyle = `rgba(${v<0?0:v},${v<0?0:v*0.5},0,0.04)`;
        ctx.fillRect(px, py, 1, 1);
    }

    // Cheek flush — rosy warmth
    const cheekL = ctx.createRadialGradient(size*0.3, size*0.52, 0, size*0.3, size*0.52, size*0.2);
    cheekL.addColorStop(0, 'rgba(210,90,70,0.13)');
    cheekL.addColorStop(1, 'rgba(210,90,70,0)');
    ctx.fillStyle = cheekL; ctx.fillRect(0,0,size,size);
    const cheekR = ctx.createRadialGradient(size*0.7, size*0.52, 0, size*0.7, size*0.52, size*0.2);
    cheekR.addColorStop(0, 'rgba(210,90,70,0.13)');
    cheekR.addColorStop(1, 'rgba(210,90,70,0)');
    ctx.fillStyle = cheekR; ctx.fillRect(0,0,size,size);

    // Forehead highlight
    const fhl = ctx.createRadialGradient(size/2, size*0.18, 0, size/2, size*0.18, size*0.28);
    fhl.addColorStop(0, 'rgba(255,235,210,0.22)');
    fhl.addColorStop(1, 'rgba(255,235,210,0)');
    ctx.fillStyle = fhl; ctx.fillRect(0,0,size,size);

    const t = new THREE.CanvasTexture(c);
    return t;
}

function makeFaceDetailTexture(size) {
    // Normal/detail map — eyebrows, eyelids, lips, nose shading, contour
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, size, size);

    const cx = size / 2;

    // ─── EYEBROWS ───
    function drawBrow(bx, dir) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(bx - dir*size*0.09, size*0.295);
        ctx.bezierCurveTo(
            bx - dir*size*0.04, size*0.270,
            bx + dir*size*0.04, size*0.268,
            bx + dir*size*0.09, size*0.285
        );
        ctx.lineWidth = size * 0.025;
        ctx.strokeStyle = '#1e1008';
        ctx.lineCap = 'round';
        ctx.stroke();
        // arch taper — thinner tail
        ctx.lineWidth = size * 0.012;
        ctx.globalAlpha = 0.55;
        ctx.stroke();
        ctx.restore();
    }
    drawBrow(cx - size*0.155, -1);
    drawBrow(cx + size*0.155,  1);

    // ─── UPPER LASH LINES ───
    function drawLash(ex) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(ex - size*0.075, size*0.382);
        ctx.bezierCurveTo(ex, size*0.370, ex + size*0.04, size*0.372, ex + size*0.075, size*0.386);
        ctx.lineWidth = size * 0.018;
        ctx.strokeStyle = '#0d0508';
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();
    }
    drawLash(cx - size*0.155);
    drawLash(cx + size*0.155);

    // ─── EYE SHADOW gradient ───
    function eyeShadow(ex) {
        const g = ctx.createRadialGradient(ex, size*0.39, 0, ex, size*0.39, size*0.07);
        g.addColorStop(0, 'rgba(80,30,60,0.28)');
        g.addColorStop(1, 'rgba(80,30,60,0)');
        ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
    }
    eyeShadow(cx - size*0.155);
    eyeShadow(cx + size*0.155);

    // ─── NOSE shading ───
    // Bridge shadow left
    const nsL = ctx.createLinearGradient(cx - size*0.04, size*0.45, cx, size*0.45);
    nsL.addColorStop(0, 'rgba(100,50,20,0.18)');
    nsL.addColorStop(1, 'rgba(100,50,20,0)');
    ctx.fillStyle = nsL;
    ctx.fillRect(0, size*0.38, size, size*0.22);
    // Bridge shadow right
    const nsR = ctx.createLinearGradient(cx + size*0.04, size*0.45, cx, size*0.45);
    nsR.addColorStop(0, 'rgba(100,50,20,0.18)');
    nsR.addColorStop(1, 'rgba(100,50,20,0)');
    ctx.fillStyle = nsR;
    ctx.fillRect(0, size*0.38, size, size*0.22);
    // Nostril shadows
    [cx - size*0.055, cx + size*0.055].forEach(nx => {
        const ng = ctx.createRadialGradient(nx, size*0.598, 0, nx, size*0.598, size*0.04);
        ng.addColorStop(0, 'rgba(60,25,10,0.45)');
        ng.addColorStop(1, 'rgba(60,25,10,0)');
        ctx.fillStyle = ng; ctx.fillRect(0,0,size,size);
    });

    // ─── LIPS ───
    ctx.save();
    // Upper lip
    ctx.beginPath();
    ctx.moveTo(cx - size*0.1, size*0.685);
    ctx.bezierCurveTo(cx - size*0.055, size*0.668, cx - size*0.018, size*0.660, cx, size*0.668);
    ctx.bezierCurveTo(cx + size*0.018, size*0.660, cx + size*0.055, size*0.668, cx + size*0.1, size*0.685);
    ctx.bezierCurveTo(cx + size*0.07, size*0.700, cx + size*0.03, size*0.706, cx, size*0.704);
    ctx.bezierCurveTo(cx - size*0.03, size*0.706, cx - size*0.07, size*0.700, cx - size*0.1, size*0.685);
    ctx.closePath();
    const lipGrad = ctx.createLinearGradient(0, size*0.660, 0, size*0.720);
    lipGrad.addColorStop(0, '#c0454e');
    lipGrad.addColorStop(0.4, '#a83848');
    lipGrad.addColorStop(1, '#7a2030');
    ctx.fillStyle = lipGrad;
    ctx.fill();
    // Lip gloss highlight
    const lipHL = ctx.createLinearGradient(0, size*0.665, 0, size*0.682);
    lipHL.addColorStop(0, 'rgba(255,200,200,0.4)');
    lipHL.addColorStop(1, 'rgba(255,200,200,0)');
    ctx.fillStyle = lipHL;
    ctx.fill();

    // Lower lip
    ctx.beginPath();
    ctx.moveTo(cx - size*0.095, size*0.708);
    ctx.bezierCurveTo(cx - size*0.06, size*0.710, cx - size*0.02, size*0.714, cx, size*0.714);
    ctx.bezierCurveTo(cx + size*0.02, size*0.714, cx + size*0.06, size*0.710, cx + size*0.095, size*0.708);
    ctx.bezierCurveTo(cx + size*0.05, size*0.738, cx + size*0.01, size*0.742, cx, size*0.742);
    ctx.bezierCurveTo(cx - size*0.01, size*0.742, cx - size*0.05, size*0.738, cx - size*0.095, size*0.708);
    ctx.closePath();
    const lipLowGrad = ctx.createLinearGradient(0, size*0.705, 0, size*0.745);
    lipLowGrad.addColorStop(0, '#b84050');
    lipLowGrad.addColorStop(0.3, '#9a3040');
    lipLowGrad.addColorStop(1, '#6a1828');
    ctx.fillStyle = lipLowGrad;
    ctx.fill();
    // Lower lip highlight dome
    const llHL = ctx.createRadialGradient(cx, size*0.715, 0, cx, size*0.715, size*0.055);
    llHL.addColorStop(0, 'rgba(255,190,190,0.35)');
    llHL.addColorStop(1, 'rgba(255,190,190,0)');
    ctx.fillStyle = llHL; ctx.fillRect(0,0,size,size);
    ctx.restore();

    // ─── CHIN shadow / jaw definition ───
    const jawShad = ctx.createLinearGradient(0, size*0.80, 0, size*0.98);
    jawShad.addColorStop(0, 'rgba(60,25,10,0)');
    jawShad.addColorStop(1, 'rgba(60,25,10,0.22)');
    ctx.fillStyle = jawShad; ctx.fillRect(0, size*0.80, size, size*0.20);

    // ─── CONTOURING — temples + cheekbone shadow ───
    [0.05, 0.95].forEach((fx, i) => {
        const contour = ctx.createLinearGradient(i===0 ? 0 : size, size*0.40, i===0 ? size*0.25 : size*0.75, size*0.55);
        contour.addColorStop(0, 'rgba(70,30,10,0.20)');
        contour.addColorStop(1, 'rgba(70,30,10,0)');
        ctx.fillStyle = contour; ctx.fillRect(0, size*0.35, size, size*0.35);
    });

    const t = new THREE.CanvasTexture(c);
    return t;
}

function makeIrisTexture(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    // Iris base — deep dark brown
    const base = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
    base.addColorStop(0, '#3a1c08');
    base.addColorStop(0.55,'#52280e');
    base.addColorStop(0.80,'#3a1c08');
    base.addColorStop(1,   '#1a0802');
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.fill();

    // Iris fibers (radial lines)
    for (let a = 0; a < 60; a++) {
        const ang = (a/60) * Math.PI * 2;
        ctx.save();
        ctx.translate(size/2, size/2);
        ctx.rotate(ang);
        ctx.strokeStyle = `rgba(${100+Math.random()*60},${40+Math.random()*30},${10},${0.12+Math.random()*0.18})`;
        ctx.lineWidth = 0.8 + Math.random();
        ctx.beginPath();
        ctx.moveTo(size*0.14, 0);
        ctx.lineTo(size*0.46, 0);
        ctx.stroke();
        ctx.restore();
    }

    // Limbal ring — dark edge
    const limbal = ctx.createRadialGradient(size/2,size/2,size*0.39, size/2,size/2,size/2);
    limbal.addColorStop(0, 'rgba(0,0,0,0)');
    limbal.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = limbal;
    ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.fill();

    // Pupil
    const pupilR = size * 0.26;
    ctx.fillStyle = '#050202';
    ctx.beginPath(); ctx.arc(size/2,size/2,pupilR,0,Math.PI*2); ctx.fill();

    // Catchlight — two points of life
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(size*0.37, size*0.36, size*0.07, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(size*0.63, size*0.62, size*0.035, 0, Math.PI*2); ctx.fill();

    const t = new THREE.CanvasTexture(c);
    return t;
}

function makeHairTexture(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1a0d07';
    ctx.fillRect(0, 0, size, size);

    // Hair strand highlights — dark glossy brunette
    for (let i = 0; i < 240; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const len = 18 + Math.random() * 40;
        const angle = Math.PI/2 + (Math.random()-0.5)*0.4;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        const hg = ctx.createLinearGradient(-len/2, 0, len/2, 0);
        const lv = 20 + Math.random() * 45;
        hg.addColorStop(0,   'rgba(0,0,0,0)');
        hg.addColorStop(0.5, `rgba(${lv+30},${lv*0.65},${lv*0.3},0.6)`);
        hg.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.strokeStyle = hg;
        ctx.lineWidth = 0.7 + Math.random() * 1.2;
        ctx.beginPath(); ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0);
        ctx.stroke();
        ctx.restore();
    }

    // Overall sheen gradient
    const sheen = ctx.createLinearGradient(0,0,size,size*0.6);
    sheen.addColorStop(0, 'rgba(80,45,20,0.18)');
    sheen.addColorStop(0.4,'rgba(60,30,10,0.1)');
    sheen.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sheen; ctx.fillRect(0,0,size,size);

    const t = new THREE.CanvasTexture(c);
    return t;
}

function makeClothingTexture(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,size,size);
    g.addColorStop(0, '#22122e');
    g.addColorStop(0.5, '#1a0e24');
    g.addColorStop(1, '#0f0818');
    ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
    // Subtle fabric grain
    for (let i = 0; i < size * 2; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        ctx.fillStyle = `rgba(139,92,246,${0.02+Math.random()*0.04})`;
        ctx.fillRect(x, y, 1 + Math.random(), 1 + Math.random());
    }
    const t = new THREE.CanvasTexture(c);
    return t;
}

/* pre-build all textures */
const skinTex    = makeSkinTexture(512);
const detailTex  = makeFaceDetailTexture(512);
const irisTex    = makeIrisTexture(128);
const hairTex    = makeHairTexture(256);
const clothTex   = makeClothingTexture(256);

/* ================================================================
   MATERIALS
================================================================ */
// Skin — MeshPhongMaterial is fast and correct for skin on mobile
const matSkin = new THREE.MeshPhongMaterial({
    map:       skinTex,
    specularMap: skinTex,
    specular:  new THREE.Color(0xffe4c8),
    shininess: 22,
    side:      THREE.FrontSide
});
const matSkinSoft = new THREE.MeshPhongMaterial({
    map:       skinTex,
    specular:  new THREE.Color(0xffd8b0),
    shininess: 16,
    side:      THREE.FrontSide
});
const matHair = new THREE.MeshPhongMaterial({
    map:       hairTex,
    specular:  new THREE.Color(0x7a5530),
    shininess: 55,
    side:      THREE.DoubleSide
});
const matIris = new THREE.MeshPhongMaterial({
    map:       irisTex,
    specular:  new THREE.Color(0xffffff),
    shininess: 140
});
const matEyeWhite = new THREE.MeshPhongMaterial({
    color:     0xf2ebe3,
    specular:  new THREE.Color(0xffffff),
    shininess: 100
});
const matCornea = new THREE.MeshPhongMaterial({
    color:     0xffffff,
    transparent: true,
    opacity:   0.12,
    specular:  new THREE.Color(0xffffff),
    shininess: 300
});
const matLash = new THREE.MeshBasicMaterial({ color: 0x0d0508 });
const matCloth = new THREE.MeshPhongMaterial({
    map:       clothTex,
    specular:  new THREE.Color(0x8B5CF6),
    shininess: 35,
    side:      THREE.DoubleSide
});
const matSkinShadow = new THREE.MeshPhongMaterial({
    color:     0xb06840,
    specular:  new THREE.Color(0xffd0a0),
    shininess: 14,
    side:      THREE.FrontSide
});

/* ================================================================
   GEOMETRY HELPERS
================================================================ */
function sphere(rx, ry, rz, ws, hs) {
    const g = new THREE.SphereGeometry(1, ws||32, hs||24);
    const m = new THREE.Mesh(g, matSkin);
    m.scale.set(rx, ry, rz);
    return m;
}
function cyl(rt, rb, h, s, mat) {
    return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s||18, 6), mat || matSkinSoft);
}

/* ================================================================
   ROOT GROUP
================================================================ */
const sasha = new THREE.Group();
scene.add(sasha);

/* ================================================================
   HEAD
   Portrait framing: head fills most of the view.
   Head centre at y = 0.
================================================================ */
const head = new THREE.Group();
sasha.add(head);

/* -- Cranium (slightly elongated ovoid) -- */
const cranium = new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 48), matSkin);
cranium.scale.set(0.80, 0.96, 0.90);
cranium.position.set(0, 0.06, 0);
head.add(cranium);

/* -- Facial plane (forehead + cheekbones protrude slightly forward) -- */
const facePlane = new THREE.Mesh(new THREE.SphereGeometry(0.36, 48, 36), matSkin);
facePlane.scale.set(0.78, 0.82, 1.05);
facePlane.position.set(0, -0.02, 0.06);
head.add(facePlane);

/* -- Jaw / lower face -- */
const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.30, 40, 32), matSkin);
jaw.scale.set(0.70, 0.55, 0.80);
jaw.position.set(0, -0.26, 0.01);
head.add(jaw);

/* -- Chin -- */
const chin = new THREE.Mesh(new THREE.SphereGeometry(0.10, 20, 16), matSkin);
chin.scale.set(0.75, 0.58, 0.70);
chin.position.set(0, -0.42, 0.06);
head.add(chin);

/* -- Cheekbones -- */
[-1,1].forEach(s => {
    const ck = new THREE.Mesh(new THREE.SphereGeometry(0.14, 24, 18), matSkin);
    ck.scale.set(1.0, 0.62, 0.72);
    ck.position.set(s * 0.27, -0.06, 0.16);
    head.add(ck);
});

/* -- Face detail texture overlay (brows, lips, nose shading, contour)
      Applied as a decal-like plane sitting just in front of the face -- */
const faceDecal = new THREE.Mesh(
    new THREE.PlaneGeometry(0.80, 0.88, 1, 1),
    new THREE.MeshBasicMaterial({
        map: detailTex,
        transparent: true,
        opacity: 1.0,
        depthWrite: false
    })
);
faceDecal.position.set(0, -0.04, 0.395);
head.add(faceDecal);

/* -- Nose -- */
const noseRoot = new THREE.Group();
noseRoot.position.set(0, 0.05, 0.36);
head.add(noseRoot);

const noseBridge = new THREE.Mesh(new THREE.SphereGeometry(0.048, 16, 12), matSkin);
noseBridge.scale.set(0.52, 2.0, 0.60);
noseBridge.position.set(0, -0.07, 0.02);
noseRoot.add(noseBridge);

const noseTip = new THREE.Mesh(new THREE.SphereGeometry(0.058, 18, 14), matSkin);
noseTip.scale.set(0.90, 0.72, 0.90);
noseTip.position.set(0, -0.18, 0.045);
noseRoot.add(noseTip);

[-1,1].forEach(s => {
    const ala = new THREE.Mesh(new THREE.SphereGeometry(0.038, 14, 10), matSkin);
    ala.scale.set(0.80, 0.62, 0.65);
    ala.position.set(s * 0.048, -0.195, 0.028);
    noseRoot.add(ala);
});

/* -- Ears -- */
[-1,1].forEach(s => {
    const ear = new THREE.Group();
    ear.position.set(s * 0.40, -0.04, 0.01);
    const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.072, 16, 12), matSkin);
    lobe.scale.set(0.38, 0.82, 0.42);
    ear.add(lobe);
    const antiT = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 8), matSkin);
    antiT.scale.set(0.5, 0.7, 0.4);
    antiT.position.set(0, 0.04, 0.01);
    ear.add(antiT);
    head.add(ear);
});

/* ================================================================
   EYES — high detail: eyeball + iris/pupil + cornea dome + lashes
================================================================ */
const leftEye  = makeEye(-0.145);
const rightEye = makeEye( 0.145);
head.add(leftEye);
head.add(rightEye);

function makeEye(x) {
    const g = new THREE.Group();
    g.position.set(x, 0.045, 0.30);

    // Eyeball
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.068, 28, 22), matEyeWhite);
    ball.scale.set(1, 0.90, 0.88);
    g.add(ball);

    // Iris disc
    const iris = new THREE.Mesh(new THREE.CircleGeometry(0.043, 40), matIris);
    iris.position.z = 0.060;
    g.add(iris);

    // Pupil dark
    const pupil = new THREE.Mesh(
        new THREE.CircleGeometry(0.020, 24),
        new THREE.MeshBasicMaterial({ color: 0x030101 })
    );
    pupil.position.z = 0.062;
    g.add(pupil);

    // Cornea dome
    const cornea = new THREE.Mesh(new THREE.SphereGeometry(0.048, 20, 16), matCornea);
    cornea.scale.set(0.88, 0.82, 0.55);
    cornea.position.z = 0.040;
    g.add(cornea);

    // Catchlight (always faces camera)
    const glint = new THREE.Mesh(
        new THREE.CircleGeometry(0.010, 12),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    glint.position.set(0.014, 0.016, 0.064);
    g.add(glint);

    // Upper eyelid crease
    const lidTop = new THREE.Mesh(
        new THREE.BoxGeometry(0.130, 0.018, 0.010),
        new THREE.MeshBasicMaterial({ color: 0x1a0d09, transparent: true, opacity: 0.85 })
    );
    lidTop.position.set(0, 0.062, 0.020);
    lidTop.rotation.x = -0.20;
    g.add(lidTop);

    // Lower lid subtle line
    const lidBot = new THREE.Mesh(
        new THREE.BoxGeometry(0.115, 0.009, 0.008),
        new THREE.MeshBasicMaterial({ color: 0x2a1010, transparent: true, opacity: 0.55 })
    );
    lidBot.position.set(0, -0.062, 0.018);
    lidBot.rotation.x = 0.16;
    g.add(lidBot);

    return g;
}

/* ================================================================
   NECK + SHOULDERS
================================================================ */
const neck = new THREE.Group();
neck.position.set(0, -0.56, 0);
head.add(neck);

const neckCyl = cyl(0.105, 0.135, 0.30, 22, matSkinSoft);
neckCyl.position.y = -0.15;
neck.add(neckCyl);

// Sternocleidomastoid — slight muscular definition
[-1,1].forEach(s => {
    const scm = cyl(0.028, 0.040, 0.24, 10, matSkinSoft);
    scm.position.set(s * 0.062, -0.12, 0.02);
    scm.rotation.z = s * 0.12;
    neck.add(scm);
});

/* ================================================================
   TORSO  (visible shoulders + chest, portrait cut-off)
================================================================ */
const torso = new THREE.Group();
torso.position.set(0, -0.86, 0);
head.add(torso);

// Shoulder width — broad graceful
[-1,1].forEach(s => {
    const trap = new THREE.Mesh(new THREE.SphereGeometry(0.18, 20, 16), matSkinSoft);
    trap.scale.set(0.90, 0.60, 0.70);
    trap.position.set(s * 0.34, 0.12, 0);
    torso.add(trap);
});

// Chest / clavicle area — LatheGeometry silhouette
const chestProfile = [
    new THREE.Vector2(0.14, 0.0),
    new THREE.Vector2(0.28, 0.06),
    new THREE.Vector2(0.36, 0.16),
    new THREE.Vector2(0.34, 0.28),
    new THREE.Vector2(0.28, 0.38),
    new THREE.Vector2(0.22, 0.46),
    new THREE.Vector2(0.26, 0.54),
    new THREE.Vector2(0.32, 0.62),
    new THREE.Vector2(0.32, 0.70),
];
const chestMesh = new THREE.Mesh(new THREE.LatheGeometry(chestProfile, 40), matCloth);
torso.add(chestMesh);

// Collarbone highlight
const clavPts = [
    new THREE.Vector3(-0.30, 0.09, 0.10),
    new THREE.Vector3(-0.10, 0.14, 0.13),
    new THREE.Vector3( 0,    0.14, 0.13),
    new THREE.Vector3( 0.10, 0.14, 0.13),
    new THREE.Vector3( 0.30, 0.09, 0.10)
];
const clavMesh = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(clavPts), 14, 0.008, 6, false),
    new THREE.MeshPhongMaterial({ color: 0xd09060, specular: 0xfff0d0, shininess: 28 })
);
torso.add(clavMesh);

/* ================================================================
   HAIR — high-volume dark brunette, textured hull + layered strands
================================================================ */
const hair = new THREE.Group();
head.add(hair);

// Outer volume cap
const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.46, 48, 36), matHair);
hairCap.scale.set(0.88, 0.72, 0.94);
hairCap.position.set(0, 0.10, -0.04);
hair.add(hairCap);

// Parted crown — slight asymmetry (part slightly left)
const crownDip = new THREE.Mesh(new THREE.SphereGeometry(0.10, 16, 12), matHair);
crownDip.scale.set(0.30, 0.20, 0.60);
crownDip.position.set(-0.02, 0.42, 0.10);
hair.add(crownDip);

// Front hairline coming forward over forehead
const forelock = new THREE.Mesh(new THREE.SphereGeometry(0.38, 36, 24), matHair);
forelock.scale.set(0.78, 0.35, 0.60);
forelock.position.set(0.0, 0.28, 0.20);
hair.add(forelock);

// Side panels — frame the face
[-1,1].forEach(s => {
    const side = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 18), matHair);
    side.scale.set(0.45, 1.10, 0.52);
    side.position.set(s * 0.38, -0.04, 0.04);
    hair.add(side);
    // Lower side — hangs past jaw
    const lower = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 14), matHair);
    lower.scale.set(0.50, 0.95, 0.48);
    lower.position.set(s * 0.38, -0.36, 0.00);
    hair.add(lower);
});

// Back bulk — long hair mass behind head
const backMass = new THREE.Mesh(new THREE.SphereGeometry(0.44, 36, 28), matHair);
backMass.scale.set(0.88, 1.30, 0.72);
backMass.position.set(0, -0.12, -0.22);
hair.add(backMass);

// Individual accent strands — front wisps
for (let i = -4; i <= 4; i++) {
    const pts = [];
    const bx = i * 0.038;
    for (let j = 0; j <= 8; j++) {
        const frac = j / 8;
        pts.push(new THREE.Vector3(
            bx + Math.sin(frac * 1.8 + i*0.3) * 0.025,
            0.32 - frac * 0.38,
            0.20 + frac * 0.10
        ));
    }
    const strand = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 8, 0.006, 5, false),
        matHair
    );
    hair.add(strand);
}

/* ================================================================
   AMBIENT PARTICLES (subtle, not cartoon)
================================================================ */
const pCount = 60;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
    pPos[i*3  ] = (Math.random()-0.5) * 2.4;
    pPos[i*3+1] = (Math.random()-0.5) * 2.4;
    pPos[i*3+2] = (Math.random()-0.5) * 1.4 - 0.4;
}
pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
const pSpeeds = new Float32Array(pCount);
for (let i = 0; i < pCount; i++) pSpeeds[i] = 0.0006 + Math.random() * 0.0012;
const particles = new THREE.Points(pGeo,
    new THREE.PointsMaterial({ color: 0x8B5CF6, size: 0.007, transparent: true, opacity: 0.28 }));
scene.add(particles);

/* ================================================================
   STATE / ANIMATION
================================================================ */
let state   = 'idle';
let walking = false;
let t = 0;
let blinkTimer = 0;
let isBlinking = false;

window.setState   = s => { state = s; };
window.setWalking = w => { walking = w; };

window.setView = function(v) {
    if (v === 'full') {
        camera.position.set(0, -0.28, 2.20);
        camera.lookAt(0, -0.20, 0);
    } else {
        camera.position.set(0, 0.08, 1.32);
        camera.lookAt(0, 0.04, 0);
    }
};

function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    // Gentle idle float
    sasha.position.y = Math.sin(t * 0.85) * 0.007;
    sasha.rotation.y = Math.sin(t * 0.30) * 0.025;

    // Breathing — chest/torso subtle scale
    const breath = Math.sin(t * 1.25) * 0.006;
    if (torso) {
        torso.scale.y = 1 + breath;
        torso.scale.x = 1 - breath * 0.5;
    }

    // Head micro-movements
    head.rotation.z = Math.sin(t * 0.42) * 0.018;

    // Speaking
    if (state === 'speaking') {
        const o = Math.abs(Math.sin(t * 14)) * 0.3 + 0.06;
        faceDecal.scale.y = 1 + o * 0.018;
        head.rotation.x = Math.sin(t * 4.2) * 0.022;
        head.rotation.z = Math.sin(t * 5.1) * 0.022;
    } else {
        faceDecal.scale.y = 1;
        if (state !== 'thinking') head.rotation.x = 0;
    }

    // Thinking
    if (state === 'thinking') {
        head.rotation.y = Math.sin(t * 0.55) * 0.10;
        head.rotation.x = Math.sin(t * 0.38) * 0.04;
        sasha.rotation.y = Math.sin(t * 0.55) * 0.06;
    } else {
        if (state !== 'speaking') {
            head.rotation.y = Math.sin(t * 0.28) * 0.015;
            sasha.rotation.y = Math.sin(t * 0.30) * 0.025;
        }
    }

    // Blink (natural timing)
    blinkTimer += 0.016;
    const blinkInterval = 3.2 + Math.sin(t * 0.2) * 1.5;
    if (!isBlinking && blinkTimer > blinkInterval) {
        isBlinking = true;
        blinkTimer = 0;
        leftEye.scale.y  = 0.04;
        rightEye.scale.y = 0.04;
        setTimeout(() => {
            leftEye.scale.y  = 1;
            rightEye.scale.y = 1;
            isBlinking = false;
        }, 95);
    }

    // Particles
    const pp = particles.geometry.attributes.position.array;
    for (let i = 0; i < pCount; i++) {
        pp[i*3+1] += pSpeeds[i];
        if (pp[i*3+1] > 1.2) {
            pp[i*3+1] = -1.2;
            pp[i*3  ] = (Math.random()-0.5) * 2.4;
            pp[i*3+2] = (Math.random()-0.5) * 1.4 - 0.4;
        }
    }
    particles.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    const W2 = window.innerWidth, H2 = window.innerHeight;
    camera.aspect = W2 / H2;
    camera.updateProjectionMatrix();
    renderer.setSize(W2, H2);
});
</script>
</body>
</html>
