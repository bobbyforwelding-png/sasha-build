<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; background: transparent; }
  #loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #d7b08b;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 2px;
    z-index: 99;
  }
</style>
</head>
<body>
<div id="loading">LOADING AVATAR...</div>
<script src="three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.getElementById('loading').textContent = 'AVATAR OFFLINE';
  throw new Error('Three.js failed to load');
}

document.getElementById('loading').style.display = 'none';

const W = window.innerWidth;
const H = window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xfff2df, 0x1b1d24, 1.15);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e3, 1.25);
key.position.set(1.2, 2.2, 2.8);
scene.add(key);

const fill = new THREE.DirectionalLight(0xcbd7ff, 0.5);
fill.position.set(-1.6, 1.2, 1.8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(0.4, 1.3, -2.3);
scene.add(rim);

const floorShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.55, 40),
  new THREE.MeshBasicMaterial({ color: 0x0a0a0f, transparent: true, opacity: 0.22 })
);
floorShadow.rotation.x = -Math.PI / 2;
floorShadow.position.y = 0.005;
scene.add(floorShadow);

const avatarRoot = new THREE.Group();
scene.add(avatarRoot);

let portraitCard = null;
let sideCards = [];
let state = 'idle';
let walking = false;
let t = 0;

function setPortraitCamera() {
  camera.position.set(0, 1.58, 1.6);
  camera.lookAt(0, 1.48, 0);
}

function setFullCamera() {
  camera.position.set(0, 1.1, 3.2);
  camera.lookAt(0, 1.0, 0);
}

window.setView = function(v) {
  if (v === 'full') {
    setFullCamera();
  } else {
    setPortraitCamera();
  }
};

window.setState = function(s) {
  state = s || 'idle';
};

window.setWalking = function(w) {
  walking = !!w;
};

function createPhotoAvatar() {
  const textureLoader = new THREE.TextureLoader();
  const photoPaths = [
    'photos/photo1.jpg',
    'photos/photo2.jpg',
    'photos/photo3.jpg'
  ];
  let loaded = 0;
  const textures = new Array(photoPaths.length);
  const fallbackTexture = new THREE.CanvasTexture((() => {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#101722';
    x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#d7b08b';
    x.font = 'bold 42px monospace';
    x.textAlign = 'center';
    x.fillText('S.A.S.H.A.', c.width / 2, c.height / 2);
    return c;
  })());

  function tryBuild() {
    loaded += 1;
    if (loaded < photoPaths.length) return;

    const portraitTexture = textures[0] || fallbackTexture;
    portraitTexture.encoding = THREE.sRGBEncoding;
    portraitTexture.minFilter = THREE.LinearFilter;
    portraitTexture.magFilter = THREE.LinearFilter;

    const portraitMaterial = new THREE.MeshBasicMaterial({
      map: portraitTexture,
      transparent: true,
      opacity: 0.96,
      side: THREE.DoubleSide
    });

    const portraitGeometry = new THREE.PlaneGeometry(0.95, 1.22);
    portraitCard = new THREE.Mesh(portraitGeometry, portraitMaterial);
    portraitCard.position.set(0, 1.25, 0);
    avatarRoot.add(portraitCard);

    const sideLeftTex = textures[1] || portraitTexture;
    const sideRightTex = textures[2] || portraitTexture;
    [sideLeftTex, sideRightTex].forEach((tex) => {
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
    });

    const sideGeo = new THREE.PlaneGeometry(0.45, 0.62);
    const leftCard = new THREE.Mesh(sideGeo, new THREE.MeshBasicMaterial({
      map: sideLeftTex,
      transparent: true,
      opacity: 0.36,
      side: THREE.DoubleSide
    }));
    leftCard.position.set(-0.68, 1.26, -0.2);
    leftCard.rotation.y = 0.58;

    const rightCard = new THREE.Mesh(sideGeo, new THREE.MeshBasicMaterial({
      map: sideRightTex,
      transparent: true,
      opacity: 0.36,
      side: THREE.DoubleSide
    }));
    rightCard.position.set(0.68, 1.26, -0.2);
    rightCard.rotation.y = -0.58;

    sideCards = [leftCard, rightCard];
    sideCards.forEach((card) => avatarRoot.add(card));
  }

  photoPaths.forEach((path, idx) => {
    textureLoader.load(
      path,
      (tex) => {
        textures[idx] = tex;
        tryBuild();
      },
      undefined,
      () => tryBuild()
    );
  });
}

createPhotoAvatar();
setPortraitCamera();

function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  const breath = Math.sin(t * 1.7) * 0.008;

  if (portraitCard) {
    const scale = state === 'speaking' ? 1.01 : (state === 'thinking' ? 0.985 : 1.0);
    portraitCard.scale.set(scale, scale, 1);
    const walkOffsetY = walking ? Math.sin(t * 7.2) * 0.012 : 0;
    const walkOffsetX = walking ? Math.sin(t * 3.6) * 0.02 : 0;
    portraitCard.position.y = 1.25 + Math.sin(t * 1.2) * 0.015 + walkOffsetY;
    portraitCard.position.x = walkOffsetX;
    portraitCard.rotation.x = breath;
    portraitCard.rotation.y = Math.sin(t * 0.45) * 0.045 + (walking ? Math.sin(t * 3.2) * 0.05 : 0);
    portraitCard.rotation.z = state === 'speaking' ? Math.sin(t * 6.0) * 0.008 : 0;
  }

  sideCards.forEach((card, i) => {
    card.position.y = 1.26 + Math.sin(t * (1.1 + i * 0.2) + i) * 0.012;
    card.rotation.z = Math.sin(t * 0.8 + i) * 0.04;
  });

  floorShadow.scale.setScalar(1 + Math.sin(t * 1.5) * 0.02);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
